<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>{{ p.name }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="player" data-kind="ready">
<a class="x" href="/programs/{{ p.id }}">✕</a>
<div class="stage">
  <div class="phase" id="phase">Get ready</div>
  <div class="media"><img id="pic" alt="" hidden><div id="nopic">🏋️</div></div>
  <h2 id="title">{{ p.name }}</h2>
  <div class="ring">
    <svg viewBox="0 0 240 240"><circle class="bg" cx="120" cy="120" r="108"/><circle id="arc" class="fg" cx="120" cy="120" r="108"/></svg>
    <div id="time">0:05</div>
  </div>
  <div id="next" class="next"></div>
  <div class="ctrl">
    <button id="prev" aria-label="Back">⏮</button>
    <button id="pp" class="big" aria-label="Pause">▶</button>
    <button id="skip" aria-label="Skip">⏭</button>
  </div>
</div>
<div id="begin" class="overlay"><button class="start">TAP TO BEGIN</button></div>
<div id="done" class="overlay" hidden><h1>Workout complete</h1><a class="start" href="/programs/{{ p.id }}">Done</a></div>
<script>
const STEPS = {{ steps|tojson }};
const seq = [{name:'Get ready', seconds:5, gif:null, kind:'ready'}].concat(STEPS);
const $ = id => document.getElementById(id), C = 2*Math.PI*108;
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
$('arc').style.strokeDasharray = C;
let i=0, end=0, remain=0, total=0, paused=true, lastSec=-1, ctx=null, wake=null;

function beep(f=880, d=.12){ if(!ctx) return; const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=f; o.connect(g); g.connect(ctx.destination); g.gain.value=.25;
  o.start(); o.stop(ctx.currentTime+d); }
function load(k){
  if(k>=seq.length){ finish(); return; }
  i=Math.max(0,k); const s=seq[i], nx=seq[i+1];
  total=remain=s.seconds*1000; end=Date.now()+remain; lastSec=-1;
  document.body.dataset.kind=s.kind;
  $('phase').textContent = s.kind==='ex'?'Work':s.kind==='rest'?'Rest':'Get ready';
  $('title').textContent = s.kind==='ready' && nx ? nx.name : s.name;
  const pic = s.gif || (s.kind!=='ex' && nx && nx.gif) || null;
  $('pic').hidden=!pic; $('nopic').hidden=!!pic; if(pic && $('pic').getAttribute('src')!==pic) $('pic').src=pic;
  $('next').textContent = nx ? 'Next: '+nx.name+' · '+fmt(nx.seconds) : 'Last one';
  beep(s.kind==='ex'?1100:660,.3); if(navigator.vibrate) navigator.vibrate(200);
  draw();
}
function draw(){ const sec=Math.ceil(remain/1000); $('time').textContent=fmt(sec);
  $('arc').style.strokeDashoffset = C*(1-remain/total); }
function setPaused(p){ paused=p; $('pp').textContent=p?'▶':'⏸';
  if(!p) end=Date.now()+remain; }
function finish(){ paused=true; $('done').hidden=false; beep(1320,.5); if(wake) wake.release(); }
setInterval(()=>{ if(paused) return; remain=end-Date.now();
  if(remain<=0){ load(i+1); return; }
  const sec=Math.ceil(remain/1000); if(sec<=3 && sec!==lastSec){ beep(880); } lastSec=sec; draw(); }, 100);

$('begin').onclick = async ()=>{ $('begin').hidden=true;
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}
  load(0); setPaused(false); };
$('pp').onclick = ()=>setPaused(!paused);
$('skip').onclick = ()=>{ load(i+1); if(!paused) setPaused(false); };
$('prev').onclick = ()=>{ load(i-1); if(!paused) setPaused(false); };
document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && !paused){
  try{ wake = await navigator.wakeLock.request('screen'); }catch(e){} }});
if(!seq.length>1) {}
</script>
</body>
</html>
