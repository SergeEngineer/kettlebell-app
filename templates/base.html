<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kettlebell">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>Kettlebell</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
{% block page %}<main>{% block body %}{% endblock %}</main>{% block post_main %}{% endblock %}{% endblock %}
<div id="gif-viewer" class="gif-viewer" hidden role="dialog" aria-modal="true" aria-label="Exercise GIF viewer" onclick="if(event.target===this)closeGifViewer()">
  <button class="gif-close" type="button" aria-label="Close full-screen GIF" onclick="closeGifViewer()">×</button>
  <img id="gif-viewer-image" alt="">
</div>
<script>
// iOS-style scroll wheels for minutes / seconds
const IH = 40;
function openGifViewer(img){
  const viewer=document.getElementById('gif-viewer'), large=document.getElementById('gif-viewer-image');
  large.src=img.currentSrc||img.src; large.alt=img.alt; viewer.hidden=false;
  document.body.classList.add('gif-viewing'); viewer.querySelector('.gif-close').focus();
}
function closeGifViewer(){
  const viewer=document.getElementById('gif-viewer'); if(viewer.hidden)return;
  viewer.hidden=true; document.body.classList.remove('gif-viewing');
  document.getElementById('gif-viewer-image').removeAttribute('src');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGifViewer()});
function wheelPaint(w){
  const c = w.scrollTop / IH, mid = Math.round(c);
  (w._lit || []).forEach(el => { el.style.opacity = ''; el.style.transform = ''; el.style.fontWeight = ''; });
  const items = w.querySelectorAll('.it'); w._lit = [];
  for (let i = Math.max(0, mid - 3); i <= Math.min(items.length - 1, mid + 3); i++) {
    const d = Math.abs(i - c), el = items[i];
    el.style.opacity = Math.max(.15, 1 - d * .36);
    el.style.transform = 'scale(' + Math.max(.72, 1 - d * .1) + ')';
    el.style.fontWeight = d < .5 ? '600' : '400';
    w._lit.push(el);
  }
}
function initWheels(root){
  (root || document).querySelectorAll('.wheel').forEach(w => {
    if (!w._init) {
      w._init = 1;
      w.addEventListener('scroll', () => {
        const v = Math.max(0, Math.min(w.querySelectorAll('.it').length - 1, Math.round(w.scrollTop / IH)));
        const item = w.querySelectorAll('.it')[v];
        w.closest('.picker').querySelector('input[name=' + w.dataset.target + ']').value = item.dataset.value ?? v;
        wheelPaint(w);
        if (Date.now() > (w._quiet || 0)) {            // user scrolled: auto-save shortly after they stop
          clearTimeout(w._t);
          w._t = setTimeout(() => { const f = w.closest('form'); if (f) f.dispatchEvent(new Event('wheeldone')); }, 600);
        }
      }, {passive: true});
      w.addEventListener('click', e => {
        const it = e.target.closest('.it'); if (!it) return;
        w.scrollTo({top: [...w.querySelectorAll('.it')].indexOf(it) * IH, behavior: 'smooth'});
      });
    }
    w._quiet = Date.now() + 500;
    w.scrollTop = (+w.dataset.val) * IH;
    const initialIndex=Math.max(0,Math.min(w.querySelectorAll('.it').length-1,+w.dataset.val));
    const initialItem=w.querySelectorAll('.it')[initialIndex];
    w.closest('.picker').querySelector('input[name='+w.dataset.target+']').value=initialItem.dataset.value??initialIndex;
    wheelPaint(w);
  });
}
function setPickerDuration(picker, seconds){
  const values={min:Math.floor(seconds/60),sec:seconds%60};
  picker.querySelectorAll('.wheel').forEach(w=>{
    const input=picker.querySelector('input[name='+w.dataset.target+']');
    input.value=values[w.dataset.target];
    const items=[...w.querySelectorAll('.it')];
    const index=items.findIndex(it=>(+(it.dataset.value??items.indexOf(it)))===values[w.dataset.target]);
    w._quiet=Date.now()+500; w.scrollTop=Math.max(0,index)*IH; wheelPaint(w);
  });
}
const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function toggleStep(row, ev){
  if (ev.target.closest('button')) return;
  const sw = row.closest('.sw');
  if (sw._dragged && Date.now() - sw._dragged < 400) return;   // a swipe, not a tap
  if (sw.classList.contains('open')) { setX(sw, 0, true); return; }
  const f = row.closest('li').querySelector('.edit'), open = f.hidden;
  document.querySelectorAll('#steps .edit').forEach(x => x.hidden = true);
  f.hidden = !open;
  if (open) initWheels(f);
}

// ---- swipe left to delete (like iOS Mail) ----
const OPEN_W = 88; let swipe = null, dragStep = null;
function setX(sw, x, anim){
  const row = sw.querySelector('.row'), del = sw.querySelector('.del');
  row.style.transition = anim ? 'transform .25s ease' : 'none';
  del.style.transition = anim ? 'width .25s ease' : 'none';
  row.style.transform = 'translateX(' + x + 'px)';
  del.style.width = Math.max(0, -x) + 'px';
  sw.classList.toggle('open', x < 0);
}
function closeSwipes(except){ document.querySelectorAll('.sw.open').forEach(sw => { if (sw !== except) setX(sw, 0, true); }); }
function removeSwipe(sw){
  const li = sw.closest('li'), kind = sw.dataset.kind, id = li.dataset.id,
        url = {program: '/programs/', exercise: '/exercises/', step: '/steps/'}[kind] + id, target = kind === 'step' ? '#steps' : '#list';
  const row = sw.querySelector('.row'), del = sw.querySelector('.del');
  row.style.transition = 'transform .2s ease'; del.style.transition = 'width .2s ease';
  row.style.transform = 'translateX(-100%)'; del.style.width = '100%';
  setTimeout(() => htmx.ajax('DELETE', url, {target}), 180);
}
function tapProgram(a, ev){
  const sw = a.closest('.sw');
  if (sw._dragged && Date.now() - sw._dragged < 400) { ev.preventDefault(); return false; }
  if (sw.classList.contains('open')) { ev.preventDefault(); setX(sw, 0, true); return false; }
  return true;
}
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.del')) return;
  const sw = e.target.closest('.sw');
  closeSwipes(sw);
  if (!sw || e.target.closest('button')) return;
  const state={sw,id:e.pointerId,x0:e.clientX,y0:e.clientY,lastY:e.clientY,base:sw.classList.contains('open')?-OPEN_W:0,locked:null,x:0};
  swipe=state;
  if(sw.dataset.kind==='step'){
    state.li=sw.closest('li');
    state.timer=setTimeout(()=>{
      if(swipe!==state)return;
      dragStep={li:state.li,id:state.id,original:[...document.querySelectorAll('#steps li')].map(li=>li.dataset.id)};
      swipe=null; state.li.classList.add('dragging');
      try{sw.querySelector('.row').setPointerCapture(state.id)}catch(_){}
    },500);
  }
});
document.addEventListener('pointermove', e => {
  if(dragStep&&e.pointerId===dragStep.id){
    const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('#steps li');
    if(target&&target!==dragStep.li){const r=target.getBoundingClientRect();e.clientY<r.top+r.height/2?target.before(dragStep.li):target.after(dragStep.li)}
    return;
  }
  if (!swipe || e.pointerId !== swipe.id) return;
  if(swipe.scrolling){window.scrollBy(0,swipe.lastY-e.clientY);swipe.lastY=e.clientY;return;}
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if (swipe.locked === null) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swipe.locked = Math.abs(dx) > Math.abs(dy);
    if (!swipe.locked) {
      if(swipe.li){clearTimeout(swipe.timer);swipe.scrolling=true;swipe.lastY=e.clientY;return;}
      swipe = null; return;
    }
    clearTimeout(swipe.timer);
    try { swipe.sw.querySelector('.row').setPointerCapture(e.pointerId); } catch (_) {}
  }
  swipe.x = Math.min(0, swipe.base + dx);
  setX(swipe.sw, swipe.x, false);
});
function endSwipe(e){
  if(dragStep&&e.pointerId===dragStep.id){
    const d=dragStep;dragStep=null;d.li.classList.remove('dragging');
    d.li.querySelector('.sw')._dragged=Date.now();
    const ids=[...document.querySelectorAll('#steps li')].map(li=>li.dataset.id);
    if(ids.join(',')!==d.original.join(',')){
      const body=new URLSearchParams();ids.forEach(id=>body.append('ids',id));
      const steps=document.getElementById('steps');
      fetch('/steps/reorder/'+steps.dataset.pid,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body,credentials:'same-origin'})
        .then(r=>{if(!r.ok)throw new Error('Reorder failed');return r.text()})
        .then(html=>{steps.innerHTML=html;htmx.process(steps)})
        .catch(()=>{const nodes=new Map([...steps.querySelectorAll('li')].map(li=>[li.dataset.id,li]));d.original.forEach(id=>{if(nodes.has(id))nodes.get(id).parentElement.append(nodes.get(id))})});
    }
    return;
  }
  if (!swipe || e.pointerId !== swipe.id) return;
  const s = swipe; swipe = null;clearTimeout(s.timer);
  if(s.scrolling)return;
  if (!s.locked) return;
  s.sw._dragged = Date.now();
  if (s.x < -s.sw.offsetWidth * 0.55) removeSwipe(s.sw);          // long swipe deletes right away
  else if (s.x < -OPEN_W / 2) setX(s.sw, -OPEN_W, true);          // short swipe reveals the bin
  else setX(s.sw, 0, true);
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

// ---- keep bottom bars attached to the keyboard / bottom edge ----
if (window.visualViewport) {
  const vv = visualViewport, root = document.documentElement;
  const upd = () => {
    const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty('--kb', kb + 'px');
    root.style.setProperty('--vvh', vv.height + 'px');
    root.style.setProperty('--vvt', vv.offsetTop + 'px');
  };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
}
// while a text field is focused: hide the tab bar so only the keyboard + the input bar are visible
const TEXTY = 'input:not([type=file]):not([type=hidden]):not([type=radio]):not([type=checkbox]), textarea';
const setTyping = () => { const a = document.activeElement; document.documentElement.classList.toggle('typing', !!(a && a.matches(TEXTY))); };
document.addEventListener('focusin', setTyping);
document.addEventListener('focusout', () => setTimeout(setTyping, 60));
function stepSaved(f){
  const li = f.closest('li'), s = (+f.elements.min.value) * 60 + (+f.elements.sec.value);
  li.dataset.seconds = s; li.querySelector('.tm').textContent = fmtTime(s);
  let sum = 0; document.querySelectorAll('#steps li[data-seconds]').forEach(x => sum += +x.dataset.seconds);
  const t = document.getElementById('tot'); if (t) t.textContent = 'Total ' + fmtTime(sum);
}
document.addEventListener('DOMContentLoaded', () => initWheels(document));
document.addEventListener('htmx:load', e => initWheels(e.detail.elt));
</script>
</body>
</html>
