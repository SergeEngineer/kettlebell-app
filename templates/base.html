<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kettlebell">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>Kettlebell</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<main>{% block body %}{% endblock %}</main>
{% if tab %}
<nav class="tabs">
  <a href="/" class="{{ 'on' if tab=='w' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg>Workouts</a>
  <a href="/exercises" class="{{ 'on' if tab=='e' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6.5"/><path d="M8.3 9.8C7 3.5 17 3.5 15.7 9.8"/></svg>Exercises</a>
</nav>
{% endif %}
<script>
// iOS-style scroll wheels for minutes / seconds
const IH = 40;
function wheelPaint(w){
  const c = w.scrollTop / IH, mid = Math.round(c);
  (w._lit || []).forEach(el => { el.style.opacity = ''; el.style.transform = ''; el.style.fontWeight = ''; });
  const items = w.querySelectorAll('.it'); w._lit = [];
  for (let i = Math.max(0, mid - 3); i <= Math.min(items.length - 1, mid + 3); i++) {
    const d = Math.abs(i - c), el = items[i];
    el.style.opacity = Math.max(.15, 1 - d * .36);
    el.style.transform = 'scale(' + Math.max(.72, 1 - d * .1) + ')';
    el.style.fontWeight = d < .5 ? '600' : '400';
    w._lit.push(el);
  }
}
function initWheels(root){
  (root || document).querySelectorAll('.wheel').forEach(w => {
    if (!w._init) {
      w._init = 1;
      w.addEventListener('scroll', () => {
        const v = Math.max(0, Math.round(w.scrollTop / IH));
        w.closest('.picker').querySelector('input[name=' + w.dataset.target + ']').value = v;
        wheelPaint(w);
        if (Date.now() > (w._quiet || 0)) {            // user scrolled: auto-save shortly after they stop
          clearTimeout(w._t);
          w._t = setTimeout(() => { const f = w.closest('form'); if (f) f.dispatchEvent(new Event('wheeldone')); }, 600);
        }
      }, {passive: true});
      w.addEventListener('click', e => {
        const it = e.target.closest('.it'); if (!it) return;
        w.scrollTo({top: [...w.querySelectorAll('.it')].indexOf(it) * IH, behavior: 'smooth'});
      });
    }
    w._quiet = Date.now() + 500;
    w.scrollTop = (+w.dataset.val) * IH;
    wheelPaint(w);
  });
}
const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function toggleStep(row, ev){
  if (ev.target.closest('button')) return;
  const sw = row.closest('.sw');
  if (sw._dragged && Date.now() - sw._dragged < 400) return;   // a swipe, not a tap
  if (sw.classList.contains('open')) { setX(sw, 0, true); return; }
  const f = row.closest('li').querySelector('.edit'), open = f.hidden;
  document.querySelectorAll('#steps .edit').forEach(x => x.hidden = true);
  f.hidden = !open;
  if (open) initWheels(f);
}

// ---- swipe left to delete (like iOS Mail) ----
const OPEN_W = 88; let swipe = null;
function setX(sw, x, anim){
  const row = sw.querySelector('.row'), del = sw.querySelector('.del');
  row.style.transition = anim ? 'transform .25s ease' : 'none';
  del.style.transition = anim ? 'width .25s ease' : 'none';
  row.style.transform = 'translateX(' + x + 'px)';
  del.style.width = Math.max(0, -x) + 'px';
  sw.classList.toggle('open', x < 0);
}
function closeSwipes(except){ document.querySelectorAll('.sw.open').forEach(sw => { if (sw !== except) setX(sw, 0, true); }); }
function removeSwipe(sw){
  const li = sw.closest('li'), id = li.dataset.id, program = sw.dataset.kind === 'program';
  if (program && !confirm('Delete this workout and all its steps? This cannot be undone.')) { setX(sw, 0, true); return; }
  const row = sw.querySelector('.row'), del = sw.querySelector('.del');
  row.style.transition = 'transform .2s ease'; del.style.transition = 'width .2s ease';
  row.style.transform = 'translateX(-100%)'; del.style.width = '100%';
  setTimeout(() => htmx.ajax('DELETE', (program ? '/programs/' : '/steps/') + id, {target: program ? '#list' : '#steps'}), 180);
}
function tapProgram(a, ev){
  const sw = a.closest('.sw');
  if (sw._dragged && Date.now() - sw._dragged < 400) { ev.preventDefault(); return false; }
  if (sw.classList.contains('open')) { ev.preventDefault(); setX(sw, 0, true); return false; }
  return true;
}
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.del')) return;
  const sw = e.target.closest('.sw');
  closeSwipes(sw);
  if (!sw || e.target.closest('button')) return;
  swipe = {sw, id: e.pointerId, x0: e.clientX, y0: e.clientY, base: sw.classList.contains('open') ? -OPEN_W : 0, locked: null, x: 0};
});
document.addEventListener('pointermove', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if (swipe.locked === null) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swipe.locked = Math.abs(dx) > Math.abs(dy);
    if (!swipe.locked) { swipe = null; return; }
    try { swipe.sw.querySelector('.row').setPointerCapture(e.pointerId); } catch (_) {}
  }
  swipe.x = Math.min(0, swipe.base + dx);
  setX(swipe.sw, swipe.x, false);
});
function endSwipe(e){
  if (!swipe || e.pointerId !== swipe.id) return;
  const s = swipe; swipe = null;
  if (!s.locked) return;
  s.sw._dragged = Date.now();
  if (s.x < -s.sw.offsetWidth * 0.55) removeSwipe(s.sw);          // long swipe deletes right away
  else if (s.x < -OPEN_W / 2) setX(s.sw, -OPEN_W, true);          // short swipe reveals the bin
  else setX(s.sw, 0, true);
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

// ---- keep bottom bars attached to the keyboard / bottom edge ----
if (window.visualViewport) {
  const vv = visualViewport, root = document.documentElement;
  const upd = () => {
    const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty('--kb', kb + 'px');
  };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
}
// while a text field is focused: hide the tab bar so only the keyboard + the input bar are visible
const TEXTY = 'input:not([type=file]):not([type=hidden]):not([type=radio]):not([type=checkbox]), textarea';
const setTyping = () => { const a = document.activeElement; document.documentElement.classList.toggle('typing', !!(a && a.matches(TEXTY))); };
document.addEventListener('focusin', setTyping);
document.addEventListener('focusout', () => setTimeout(setTyping, 60));
function stepSaved(f){
  const li = f.closest('li'), s = (+f.elements.min.value) * 60 + (+f.elements.sec.value);
  li.dataset.seconds = s; li.querySelector('.tm').textContent = fmtTime(s);
  let sum = 0; document.querySelectorAll('#steps li[data-seconds]').forEach(x => sum += +x.dataset.seconds);
  const t = document.getElementById('tot'); if (t) t.textContent = 'Total ' + fmtTime(sum);
}
document.addEventListener('DOMContentLoaded', () => initWheels(document));
document.addEventListener('htmx:load', e => initWheels(e.detail.elt));
</script>
</body>
</html>
