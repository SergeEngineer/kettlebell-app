{% if steps %}
<ul class="group">
{% for s in steps %}
  <li class="row">
    {% if s.gif %}<img class="thumb" src="/media/{{ s.gif }}" alt="">
    {% elif s.exercise_id %}<span class="thumb rest">{{ s.name[:1]|upper }}</span>
    {% else %}<span class="thumb rest sm">REST</span>{% endif %}
    <span class="grow"><strong>{{ s.name or 'Rest' }}</strong><small>{{ s.seconds|fmt }}</small></span>
    <button class="icon" hx-post="/steps/{{ s.id }}/move/up" hx-target="#steps" {% if loop.first %}disabled{% endif %}>↑</button>
    <button class="icon" hx-post="/steps/{{ s.id }}/move/down" hx-target="#steps" {% if loop.last %}disabled{% endif %}>↓</button>
    <button class="icon red" hx-delete="/steps/{{ s.id }}" hx-target="#steps">✕</button>
  </li>
{% endfor %}
</ul>
<p class="total">Total {{ total|fmt }}</p>
{% else %}<p class="empty">No steps yet. Add a workout or a rest below.</p>{% endif %}
