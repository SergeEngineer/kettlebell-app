{% extends "base.html" %}
{% block body %}
<h1>Workouts</h1>
<div id="list">{{ partial|safe }}</div>
<form class="addbar" hx-post="/programs" hx-target="#list" hx-on::after-request="this.reset()">
  <input name="name" placeholder="New workout name" required autocomplete="off" enterkeyhint="done">
  <button>Add</button>
</form>
{% endblock %}
