{% extends "base.html" %}
{% block body %}
<h1>Workouts</h1>
<form class="group add" hx-post="/programs" hx-target="#list" hx-on::after-request="this.reset()">
  <input name="name" placeholder="New workout name" required autocomplete="off">
  <button class="blue">Add</button>
</form>
<div id="list">{{ partial|safe }}</div>
{% endblock %}
