{% extends "base.html" %}
{% block page %}
<div class="shell">
  <div class="scroll"><div class="col">
    <h1>Workouts</h1>
    <div id="list">{{ partial|safe }}</div>
  </div></div>
  <form class="addbar" hx-post="/programs" hx-target="#list" hx-on::after-request="this.reset()" autocomplete="on">
    <input name="wk_title" type="text" placeholder="New workout name" required autocomplete="on" autocorrect="on" autocapitalize="words" spellcheck="true" enterkeyhint="done">
    <button>Add</button>
  </form>
  {% include "_tabs.html" %}
</div>
{% endblock %}
