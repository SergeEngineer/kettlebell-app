{% extends "base.html" %}
{% block body %}{% from "_wheel.html" import wheel %}
<a class="back" href="/">‹ Workouts</a>
<div class="titlebar">
  <h1 id="ttl">{{ p.name }}</h1>
  <button class="icon" aria-label="Rename workout"
    onclick="document.querySelector('.titlebar').hidden=true;const f=document.getElementById('tform');f.hidden=false;f.wk_rename.focus()">✎</button>
</div>
<form id="tform" class="group" hidden hx-post="/programs/{{ p.id }}/rename" hx-swap="none"
      hx-on::after-request="const v=this.wk_rename.value.trim(); if(v) document.getElementById('ttl').textContent=v; this.hidden=true; document.querySelector('.titlebar').hidden=false">
  <div class="row"><input name="wk_rename" value="{{ p.name }}" required autocomplete="on" autocorrect="on" spellcheck="true">
    <button type="button" class="dimbtn" onclick="this.closest('form').hidden=true;document.querySelector('.titlebar').hidden=false">Cancel</button>
    <button class="blue">Save</button></div>
</form>
<div id="steps">{{ partial|safe }}</div>

<h2>Add step</h2>
<form id="addstep" class="group" hx-post="/programs/{{ p.id }}/steps" hx-target="#steps" hx-encoding="multipart/form-data"
      hx-on::before-request="this._new = this.kind.value==='workout' && this.exercise.value==='new'"
      hx-on::after-request="if(this._new){location.reload()}else{this.reset();ui(this);initWheels(this)}">
  <div class="seg">
    <label><input type="radio" name="kind" value="workout" checked>Workout</label>
    <label><input type="radio" name="kind" value="rest">Rest</label>
  </div>
  <div class="wk">
    <label class="row"><span class="grow">Exercise</span>
      <select name="exercise">
        {% for e in exercises %}<option value="{{ e.id }}">{{ e.name }}</option>{% endfor %}
        <option value="new" {% if not exercises %}selected{% endif %}>＋ New exercise (upload GIF)</option>
      </select></label>
    <div class="nw">
      <div class="row"><input name="ex_new_title" placeholder="Exercise name" autocomplete="on" autocorrect="on" spellcheck="true"></div>
      <label class="row"><span class="grow">GIF</span><input type="file" name="gif" accept="image/gif,image/webp,image/png,image/jpeg"></label>
    </div>
  </div>
  {{ wheel(5, 0) }}
  <div class="row"><button class="blue wide">Add to workout</button></div>
</form>

<div class="startbar"><a class="start" href="/run/{{ p.id }}">START</a></div>
<script>
function ui(f){
  const w = f.kind.value === 'workout';
  f.querySelector('.wk').hidden = !w;
  const n = w && f.exercise.value === 'new';
  f.querySelector('.nw').hidden = !n;
  f['ex_new_title'].required = n;
}
const f = document.getElementById('addstep');
f.addEventListener('change', () => ui(f));
ui(f);
</script>
{% endblock %}
